name: ci

on:
  push:
    branches: [develop, qa, main, feat/persistent-sale-orchestration]
  pull_request:
    branches: [develop, qa, main]

permissions:
  contents: read

jobs:
  check-common-files:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify common repository files exist
        run: |
          set -e
          test -f README.md
          test -f .gitignore
          test -f .github/CODEOWNERS
          test -f .github/pull_request_template.md
          test -f .env.example
          echo "Common files present."

  build-test-and-architecture-check:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"
      - name: Build and test
        run: mvn -B verify
      - name: Published coverage gates
        run: python tests/check_coverage.py
      - name: Owning runner deployment contract
        run: python -m unittest discover -s tests -p test_deployment.py
      - name: Architecture check — workflow-core has no Spring dependency
        run: |
          set -euo pipefail
          mvn -q -pl workflow-core dependency:tree -DoutputFile=/tmp/workflow-core-deps.txt
          test -s /tmp/workflow-core-deps.txt
          if grep -Eqi 'org.springframework|org.postgresql|com.zaxxer|org.apache.httpcomponents' /tmp/workflow-core-deps.txt; then
            echo "workflow-core depends on Spring:"
            cat /tmp/workflow-core-deps.txt
            exit 1
          fi
          echo "Architecture check passed: workflow-core has no Spring dependency."

  real-process-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install cryptography==46.0.3
      - name: Local cleanup registration regression
        run: python -m unittest discover -s tests -p test_process_support.py
      - name: Owning runner and real JVM recovery with controlled participants
        run: python tests/process_acceptance.py
